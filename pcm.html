<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema PCM</title>
<style>
:root{
  --ink:#14181C; --ink-2:#1D2227; --paper:#F6F3EC; --paper-2:#EFEAE0; --white:#FFFFFF;
  --gold:#AD8752; --gold-soft:#D9C6A3; --teal:#2C5457; --teal-soft:#4B7C7E;
  --line:#DCD4C2; --line-dark:#33393F;
  --vermelho:var(--gold); --vermelho-escuro:var(--teal); --vermelho-suave:rgba(173,135,82,.10); --vermelho-suave-2:rgba(173,135,82,.18);
  --fundo:var(--paper); --branco:var(--white); --texto:var(--ink); --texto-sec:rgba(20,24,28,.60); --borda:var(--line);
  --sombra-sm:0 1px 3px rgba(26,32,44,.06); --sombra-md:0 8px 24px rgba(26,32,44,.08);
  --radius:12px; --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:inherit;text-decoration:none}

.header{position:fixed;top:0;left:0;right:0;height:64px;background:var(--branco);border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;box-shadow:var(--sombra-sm)}
.header-esq{display:flex;align-items:center;gap:12px}
.logo-mini{width:38px;height:38px;border-radius:10px;background:var(--vermelho);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca-texto h1{font-size:.92rem;font-weight:700;line-height:1.2}
.marca-texto p{font-size:.7rem;color:var(--texto-sec)}
.header-dir{display:flex;align-items:center;gap:8px}
.usuario-area{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--borda)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--vermelho),var(--vermelho-escuro));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.75rem;flex-shrink:0}
.usuario-info .nome{font-size:.8rem;font-weight:600;line-height:1.2}
.usuario-info .funcao{font-size:.68rem;color:var(--texto-sec)}
.btn-sair{padding:8px 14px;font-size:.78rem;font-weight:600;color:var(--vermelho);background:var(--vermelho-suave);border:none;border-radius:8px;display:inline-block}
.btn-sair:hover{background:var(--vermelho-suave-2)}
.btn-trocar{padding:8px 14px;font-size:.78rem;font-weight:600;color:var(--texto);background:var(--fundo);border:1px solid var(--borda);border-radius:8px;display:inline-block}
.btn-trocar:hover{background:var(--vermelho-suave);border-color:transparent;color:var(--vermelho)}

.pcm-tabs{margin-top:64px;background:#fff;border-bottom:1px solid var(--borda);display:flex;padding-left:20px}
.pcm-tab{padding:13px 18px;border:none;background:none;font-weight:500;color:var(--texto-sec);border-bottom:3px solid transparent;font-size:.8rem}
.pcm-tab.ativo{font-weight:700;color:var(--vermelho);border-bottom-color:var(--vermelho)}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card-kpi{background:var(--branco);border-radius:var(--radius);padding:14px;box-shadow:var(--sombra-sm);border:1px solid var(--borda)}
.card-kpi-valor{font-size:1.5rem;font-weight:800}
.card-kpi-label{font-size:.72rem;color:var(--texto-sec);margin-top:2px;font-weight:600}

.modal-overlay{position:fixed;inset:0;background:rgba(26,32,44,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--branco);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--sombra-md);max-height:90vh;overflow-y:auto}
.modal-rodape{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--borda);flex-wrap:wrap}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#fff;padding:12px 26px;border-radius:12px;font-weight:700;font-size:.82rem;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:2000;white-space:nowrap}

@media (max-width:900px){ .usuario-info{display:none} }
</style>
</head>
<body>
<div id="root"></div>

<script>
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
function addDias(data, d) { const r = new Date(data); r.setDate(r.getDate() + d); return r; }
function fmtDate(d) { if(!(d instanceof Date)) d = new Date(d); return d.toLocaleDateString("pt-BR"); }
function parseDataLocal(str) {
if (!str) return null;
const [y,m,d] = str.split("-").map(Number);
return new Date(y, m-1, d);
}
function diffDias(d) { return Math.round((d - HOJE) / 86400000); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function setPath(obj, path, val){ const parts = path.split("."); let o = obj; for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = val; }

function lerParamsUsuario() {
const params = new URLSearchParams(window.location.search);
return {
nome: params.get("nome") || "Mauro Ledur",
perfil: params.get("perfil") || "Operador",
};
}

const MAQUINAS = ["ABG","CD","Coladeira 10","Coladeira 20","Coladeira Eureka","Corte Vinco - 03","Corte Vinco Automática","CVA Hot e relevo","Desfolhadeira","Dobradeira","Embalagem 1","Embalagem 2","Gallus","Guilhotina Recorte (INA1)","Guilhotina Recorte (INA3)","Ibirama - Recorte (Baldo)","MA 330","Mark Andy 330","New Foil","Nilpeter 250","Nilpeter 420","Rotoflex 01","Rotoflex 02","Rotoflex 03"];
const RESPONSAVEIS = ["Mauro Ledur","Soli Rodrigues","Alexandre Pereira","Anderson Lima","Andre Martins","Carlos Eduardo","Daniel Ribeiro","Eduardo Barros","Felipe Araujo","Fernando Correia","Gabriel Moreira","Guilherme Borges","Henrique Ramos","Leonardo Batista","Lucas Andrade","Marcelo Queiroz","Marcos Vinicius","Mateus Coelho","Rafael Sousa","Rodrigo Leal","Thiago Carvalho"];

const EST = {

PD: {label:"PD — Preditiva", color:"#7c3aed", bg:"#f5f3ff"},
PIR:{label:"PIR — Inspeção", color:"#b45309", bg:"#fffbeb"},

const PERFIS_PODEM_EXCLUIR = ["Administrador","Gestor de Manutenção"];

const SUGESTAO_ESTRATEGIA = {
A: ["PP","PD"],

};
const MOTIVO_SUGESTAO = {
A: "Equipamento de criticidade alta: impacta fortemente a produção, a qualidade e/ou a segurança. Recomenda-se manutenção Preventiva (PP), com intervenções programadas, aliada à Preditiva (PD), para monitorar condições e antecipar falhas antes que ocorram.",
B: "Equipamento de criticidade média: recomenda-se Inspeção de Rotina (PIR) para detectar desvios precocemente, Lubrificação (PL) periódica para preservar componentes e Manutenção Autônoma (MA) para envolver o operador nos cuidados básicos diários.",
C: "Equipamento de criticidade baixa: ainda assim, recomenda-se Inspeção de Rotina (PIR), Lubrificação (PL) periódica e Manutenção Autônoma (MA) pelo operador, garantindo cuidados básicos sem exigir estratégias mais intensivas.",
};

const SETORES = ["TI", "Manutenção", "Offset", "Acabamento", "Qualidade"];

const PRIORIDADES_SC = {
"Imediato": { desc:"Realizar neste exato momento.", color:"#CC1B1B", bg:"rgba(204,27,27,.08)" },
"Urgente": { desc:"Realizar assim que possível.", color:"#b45309", bg:"#fffbeb" },
"A programar": { desc:"Realizar conforme disponibilidade da manutenção.", color:"#2563eb", bg:"#eff6ff" },
};

const MATRIZ = [
{id:1,peso:10,label:"Impacto na produção / qualidade do produto", opcoes:[{label:"Alto",val:10},{label:"Médio",val:5},{label:"Baixo",val:0}]},
{id:2,peso:10,label:"Impactos nos índices de produtividade", opcoes:[{label:"Alto",val:10},{label:"Médio",val:5},{label:"Baixo",val:0}]},
{id:3,peso:3, label:"Funcionamento Contínuo", opcoes:[{label:"Sim",val:10},{label:"Não",val:0}]},
{id:4,peso:2, label:"Frequência de Falhas", opcoes:[{label:"Diversas falhas semanais",val:10},{label:"Diversas falhas mensais",val:5},{label:"Diversas falhas anuais",val:0}]},
{id:5,peso:1, label:"Existe equipamento reserva", opcoes:[{label:"Sim",val:0},{label:"Não",val:10}]},
{id:6,peso:1, label:"Tempo Médio de Reparo ou Substituição", opcoes:[{label:"0–3 min",val:1},{label:"3–15 min",val:4},{label:"15–30 min",val:7},{label:"> 30 min",val:10}]},
{id:7,peso:1, label:"Risco de Segurança e/ou Meio Ambiente", opcoes:[{label:"Sim",val:10},{label:"Não",val:0}]},
];
function calcCri(resp) {
return MATRIZ.reduce((a,m)=>{
const manual = resp[`${m.id}_manual`];
const val = (manual!==undefined && manual!=="") ? Number(manual) : resp[m.id];
return a + (val!==undefined ? val*m.peso : 0);
}, 0);
}
function matrizRespondida(matriz) {
return MATRIZ.every(m=>{
const manual = matriz[`${m.id}_manual`];
const minVal = Math.min(...m.opcoes.map(o=>o.val));
const maxVal = Math.max(...m.opcoes.map(o=>o.val));
if (manual!==undefined && manual!=="") {
const n = Number(manual);
return !isNaN(n) && n>=minVal && n<=maxVal;
}
return matriz[m.id] !== undefined;
});
}
function calcClasse(c) { return c>200?"A":c>=50?"B":"C"; }

function equipamentosIniciais() {
return [
{desc:"Entrada do papel",tag:"CD001.1",cod:"",criTotal:247,criClasse:"A",prazoD:90,estrategias:["PP","PIR"],maquina:"CD",ultimaManutencao:"2026-03-05",naoSeiData:false},
{desc:"Margeador",tag:"CD001.1.1",cod:"",criTotal:247,criClasse:"A",prazoD:30,estrategias:["PP","PIR"],maquina:"CD",ultimaManutencao:"",naoSeiData:true},
{desc:"Apalpador",tag:"CD001.1.2",cod:"C5.028.075F",criTotal:237,criClasse:"A",prazoD:60,estrategias:["PP"],maquina:"CD",ultimaManutencao:"2026-04-04",naoSeiData:false},
{desc:"Arco guia",tag:"CD001.1.1.1",cod:"L2.020.207",criTotal:114,criClasse:"B",prazoD:90,estrategias:["PP","MA"],maquina:"CD",ultimaManutencao:"",naoSeiData:true},
{desc:"Esquadro",tag:"CD001.1.2b",cod:"",criTotal:167,criClasse:"B",prazoD:30,estrategias:["PP","MA"],maquina:"CD",ultimaManutencao:"2026-05-04",naoSeiData:false},
{desc:"Correia dentada de tracao",tag:"CD001.1.2.1",cod:"",criTotal:247,criClasse:"A",prazoD:90,estrategias:["PP","PD"],maquina:"CD",ultimaManutencao:"",naoSeiData:true},
{desc:"Motor Tinteiro",tag:"CD001.2.1",cod:"L2.105.1051",criTotal:110,criClasse:"B",prazoD:90,estrategias:["PP","PD"],maquina:"CD",ultimaManutencao:"2026-03-05",naoSeiData:false},
{desc:"Rolo tinta chapa 1",tag:"CD001.2.2",cod:"902902",criTotal:167,criClasse:"B",prazoD:120,estrategias:["PP","PL"],maquina:"CD",ultimaManutencao:"",naoSeiData:true},
{desc:"Motor principal",tag:"CD001.3.1.4",cod:"M4.101.2003",criTotal:150,criClasse:"B",prazoD:150,estrategias:["PP","PD","PL"],maquina:"CD",ultimaManutencao:"2026-01-04",naoSeiData:false},
{desc:"Gaita entrada (Fole)",tag:"CD001.1.2.2",cod:"L2.072.324",criTotal:11,criClasse:"C",prazoD:90,estrategias:["PIR"],maquina:"CD",ultimaManutencao:"",naoSeiData:true},
{desc:"Rolo de transferencia",tag:"CD001.2.6",cod:"902910",criTotal:167,criClasse:"B",prazoD:60,estrategias:["PP","PIR"],maquina:"CD",ultimaManutencao:"2026-04-04",naoSeiData:false},
].map(e=>{
const ref = e.naoSeiData ? HOJE : new Date(e.ultimaManutencao);
const dataIntervencao = addDias(ref, e.prazoD);
return {...e, setor:"Offset", dataRef:ref, dataIntervencao, diasRestantes:diffDias(dataIntervencao), ativo:true};
});
}


const App = {
osCnt: 1,
scCnt: 1,
state: {
usuarioLogado: lerParamsUsuario(),
toastMsg: null,
equipamentos: equipamentosIniciais(),
os: [],
logAuditoria: [],
pcmAba: "dashboard",
pcmBusca: "", pcmFiltroStatus: "Todos",
eqFormAberto: null,
eqFormDados: null,
eqFormErros: {},
detalheOS: null, detalheForm: {status:"",dataPrevConc:""},
aprovFlow: null, erroAprov: "",
relatorio: null,
excluirEq: null,
solicitacoesCorretivas: [],
scForm: { setor:"", maquina:"", codigoPeca:"", dataOcorrencia:"", ocorrencia:"", impacto:"", prioridade:"" },
scErros: {},
setores: SETORES.slice(),
  maquinas: MAQUINAS.slice(),
  setorBusca: "", setorModalAberto: false, setorEditando: null, setorModalErro: "", novoSetor: {nome:""},
  maquinaBusca: "", maquinaModalAberto: false, maquinaEditando: null, maquinaModalErro: "", novaMaquina: {nome:""},
  removerCadastro: null,
},

set(patch) { Object.assign(this.state, patch); this.render(); },
showToast(msg) { this.set({toastMsg: msg}); setTimeout(()=>{ this.state.toastMsg=null; this.render(); }, 3000); },

captureFocus() {
const el = document.activeElement;
if (!el || !el.id) return null;
return { id: el.id, start: el.selectionStart, end: el.selectionEnd };
},
restoreFocus(info) {
if (!info) return;
const el = document.getElementById(info.id);
if (!el) return;
el.focus();
if (typeof info.start === "number" && el.setSelectionRange) { try { el.setSelectionRange(info.start, info.end); } catch(e) {} }
},

render() {
const focusInfo = this.captureFocus();
const s = this.state;
const equipamentosAtivos = s.equipamentos.filter(e=>e.ativo!==false);
const kpisUrgentes = equipamentosAtivos.filter(e=>e.diasRestantes<=30);
const kpisAtencao = equipamentosAtivos.filter(e=>e.diasRestantes>30 && e.diasRestantes<=60);
const osAbertas = s.os.filter(o=>o.status==="Aberta");
const osConcluidas = s.os.filter(o=>o.status==="Concluida").length;

const ABAS = [
{id:"dashboard",label:"📊 Dashboard"},
{id:"equipamentos",label:"⚙️ Equipamentos"},
{id:"os",label:"📋 Ordens de Serviço"},
{id:"estrategia",label:"🎯 Estratégias"},
{id:"solicitacaocorretiva",label:"🛠️ Solicitação Corretiva"},
  {id:"setores",label:"🏢 Cadastro de Setor"},
  {id:"maquinas",label:"🔩 Cadastro de Máquinas"},
];

let corpo = "";
if (s.pcmAba === "dashboard") corpo = this.pcmDashboard(equipamentosAtivos, kpisUrgentes, kpisAtencao, osAbertas, osConcluidas);
else if (s.pcmAba === "equipamentos") corpo = this.pcmEquipamentos(equipamentosAtivos);
else if (s.pcmAba === "os") corpo = this.pcmOS();
else if (s.pcmAba === "estrategia") corpo = this.pcmEstrategias(equipamentosAtivos);
else if (s.pcmAba === "solicitacaocorretiva") corpo = this.pcmSolicitacaoCorretiva();
else if (s.pcmAba === "setores") corpo = this.pcmSetores();
  else if (s.pcmAba === "maquinas") corpo = this.pcmMaquinas();

const u = s.usuarioLogado;
const iniciais = u.nome.split(" ").map(n=>n[0]).slice(0,2).join("");
const paramsAtual = "?nome=" + encodeURIComponent(u.nome) + "&perfil=" + encodeURIComponent(u.perfil);

let html = `
<header class="header">
<div class="header-esq">
<div class="logo-mini">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
</svg>
</div>
<div class="marca-texto"><h1>Sistema PCM</h1><p> Planejamento e Controle da Manutenção</p></div>
</div>
<div class="header-dir">
${u.perfil==="Administrador" ? `<a class="btn-trocar" href="${'admin.html' + paramsAtual}">Ir para Portal Admin</a>` : ""}
<div class="usuario-area">
<div class="avatar">${esc(iniciais)}</div>
<div class="usuario-info"><div class="nome">${esc(u.nome)}</div><div class="funcao">${esc(u.perfil)}</div></div>
</div>
<a class="btn-sair" href="login.html">Sair</a>
</div>
</header>
<div class="pcm-tabs">
${ABAS.map(a=>`<button class="pcm-tab ${s.pcmAba===a.id?'ativo':''}" data-act="setPcmAba" data-p1="${a.id}">${a.label}</button>`).join("")}
</div>
<div style="padding:18px 20px;max-width:1100px;margin:0 auto">${corpo}</div>
${s.detalheOS ? this.modalDetalheOS() : ""}
${s.excluirEq ? this.modalExcluirEq() : ""}
`;
if (s.toastMsg) html += `<div class="toast">${esc(s.toastMsg)}</div>`;
document.getElementById("root").innerHTML = html;
this.restoreFocus(focusInfo);
},

setPcmAba(id) { this.set({pcmAba:id, pcmBusca:"", pcmFiltroStatus:"Todos"}); },

legendaEstrategias() {
return `
<div style="background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)">
<div style="font-size:10px;font-weight:700;color:var(--texto-sec);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Legenda — Estratégias de Manutenção</div>
<div style="display:flex;flex-wrap:wrap;gap:6px">
${Object.entries(EST).map(([k,v])=>`<span style="background:${v.bg};color:${v.color};border:1.5px solid ${v.color}33;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600">${esc(v.label)}</span>`).join("")}
</div>
</div>
`;
},

bdg(label,color,bg){ return `<span style="background:${bg};color:${color};padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap">${esc(label)}</span>`; },
cbdg(cls){ const c=CC[cls]||CC.B; return `<span style="background:${c.bg};color:${c.text};border:1px solid ${c.border};padding:2px 8px;border-radius:99px;font-weight:700;font-size:11px">${esc(cls)}</span>`; },
ubdg(dias){
let color,bg,txt;
if(dias<=0){color="#7c3aed";bg="#f5f3ff";txt=`🔴 ${dias}d`;}
else if(dias<=30){color="#A81616";bg="rgba(204,27,27,.08)";txt=`⚠ ${dias}d`;}
else if(dias<=60){color="#854d0e";bg="#fef9c3";txt=`⏰ ${dias}d`;}
else {color="#166534";bg="#f0fdf4";txt=`✓ ${dias}d`;}
return `<span style="background:${bg};color:${color};padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700">${txt}</span>`;
},


pcmDashboard(equipamentosAtivos, urgentes, atencao, osAbertas, osConcluidas) {
const proximas = equipamentosAtivos.filter(e=>e.diasRestantes<=30).sort((a,b)=>a.diasRestantes-b.diasRestantes).slice(0,7);
const cardDef = [
{tipo:"urgentes",icon:"🚨",label:"Interv. ≤ 30d",count:urgentes.length,color:"#CC1B1B",bg:"rgba(204,27,27,.08)",desc:"Gerar OS urgente"},
{tipo:"atencao",icon:"⏰",label:"Interv. 31–60d",count:atencao.length,color:"#b45309",bg:"#fef9c3",desc:"Gerar OS de atenção"},
{tipo:"abertas",icon:"📂",label:"OS Abertas",count:osAbertas.length,color:"#2563eb",bg:"#eff6ff",desc:"Revisar OS abertas"},
];
const kpisMini = [
{label:"Total Equip.",val:equipamentosAtivos.length,color:"#27272a",icon:"⚙️"},
{label:"Classe A",val:equipamentosAtivos.filter(e=>e.criClasse==="A").length,color:"#CC1B1B",icon:"🔴"},
{label:"Classe B",val:equipamentosAtivos.filter(e=>e.criClasse==="B").length,color:"#b45309",icon:"🟡"},
{label:"Classe C",val:equipamentosAtivos.filter(e=>e.criClasse==="C").length,color:"#0d9488",icon:"🟢"},
{label:"OS Concluídas",val:osConcluidas,color:"#0d9488",icon:"✅"},
];
return `
<div class="grid-kpi">

<div style="font-size:10px;color:#d4d4d8">${MATRIZ.filter(m=>{
const manual=d.matriz[`${m.id}_manual`];
const minV=Math.min(...m.opcoes.map(o=>o.val)), maxV=Math.max(...m.opcoes.map(o=>o.val));
if(manual!==undefined&&manual!==""){const n=Number(manual);return !isNaN(n)&&n>=minV&&n<=maxV;}

<span style="font-weight:800;font-size:16px;color:#1e3a5f">${criAtual} pts</span>${this.cbdg(classeAtual)}

${(d.criTotalFixo !== undefined || matrizRespondida(d.matriz)) ? `

toggleNaoSeiData() {
const d = this.state.eqFormDados;
d.naoSeiData = !d.naoSeiData;
if (d.naoSeiData) d.ultimaManutencao = "";
this.render();
},
setMatrizVal(itemId, val) {
this.state.eqFormDados.matriz[itemId] = Number(val);
this.state.eqFormDados.matriz[`${itemId}_manual`] = "";
this.render();
},
toggleEstrategiaForm(k) {
const d = this.state.eqFormDados;
const i = d.estrategias.indexOf(k);
if (i>=0) d.estrategias.splice(i,1); else d.estrategias.push(k);
this.render();
},

salvarFormEquipamento() {
const s = this.state;
const d = s.eqFormDados;
const editando = s.eqFormAberto !== "novo";
const erros = {};

if (!d.desc.trim()) erros.desc = "Informe a descrição do equipamento.";
if (!d.tag.trim()) erros.tag = "Informe a TAG do equipamento.";
else if (!editando && s.equipamentos.find(e=>e.tag===d.tag.trim())) erros.tag = "Esta TAG já está cadastrada.";
if (!d.prazoD || isNaN(d.prazoD) || Number(d.prazoD)<1) erros.prazoD = "Informe um prazo válido (mínimo 1 dia).";
if (!d.naoSeiData && !d.ultimaManutencao) erros.dataBase = "Informe a data da última manutenção ou marque 'Não sei informar'.";
if (d.criTotalFixo===undefined && !matrizRespondida(d.matriz)) erros.matriz = "Responda todos os 7 itens da matriz de criticidade (por botão ou valor manual dentro da faixa).";
if (d.estrategias.length===0) erros.estrategias = "Selecione ao menos uma estratégia de manutenção.";

if (Object.keys(erros).length > 0) { this.set({ eqFormErros: erros }); return; }

const criTotal = d.criTotalFixo!==undefined ? d.criTotalFixo : calcCri(d.matriz);
const criClasse = d.criClasseFixa!==undefined ? d.criClasseFixa : calcClasse(criTotal);
const prazoD = Number(d.prazoD);
const ref = d.naoSeiData ? HOJE : new Date(d.ultimaManutencao);
const dataIntervencao = addDias(ref, prazoD);

const novoEq = {
desc:d.desc.trim(), tag:d.tag.trim(), cod:(d.cod||"").trim(), maquina:d.maquina,
prazoD, ultimaManutencao:d.ultimaManutencao, naoSeiData:d.naoSeiData,
criTotal, criClasse, estrategias:[...d.estrategias], setor:d.setor||"",
dataRef:ref, dataIntervencao, diasRestantes:diffDias(dataIntervencao), ativo:true,
};

if (editando) {
s.equipamentos = s.equipamentos.map(e => e.tag===s.eqFormAberto.tag ? novoEq : e);
this.showToast("✅ Equipamento atualizado com sucesso!");
} else {
s.equipamentos.push(novoEq);
this.showToast("✅ Equipamento cadastrado com sucesso!");
}
this.set({ eqFormAberto:null, eqFormDados:null, eqFormErros:{} });
},

temFilhos(eq) { return this.state.equipamentos.some(e => e.tag!==eq.tag && e.ativo!==false && e.tag.startsWith(eq.tag+".")); },
temOSVinculada(eq) { return this.state.os.some(o => o.tag===eq.tag); },

abrirExclusao(tag) {
const eq = this.state.equipamentos.find(e=>e.tag===tag);
if(!eq) return;
if (!PERFIS_PODEM_EXCLUIR.includes(this.state.usuarioLogado.perfil)) { this.showToast("⛔ Você não tem permissão para excluir equipamentos."); return; }
this.set({ excluirEq: eq });
},

confirmarExclusao() {
const s = this.state;
const eq = s.excluirEq;
if (!eq) return;
if (!PERFIS_PODEM_EXCLUIR.includes(s.usuarioLogado.perfil)) { this.showToast("⛔ Permissão negada."); this.set({excluirEq:null}); return; }
if (this.temFilhos(eq)) { this.showToast("⚠️ Este equipamento possui itens subordinados."); this.set({excluirEq:null}); return; }
if (this.temOSVinculada(eq)) { this.showToast("⚠️ Este equipamento possui OS associadas e não pode ser excluído."); this.set({excluirEq:null}); return; }

s.equipamentos = s.equipamentos.map(e => e.tag===eq.tag ? {...e, ativo:false} : e);
s.logAuditoria.push({
acao:"EXCLUSAO_EQUIPAMENTO", tag:eq.tag, desc:eq.desc,
usuario:s.usuarioLogado.nome, perfil:s.usuarioLogado.perfil,
dataHora:new Date().toLocaleString("pt-BR"),
});
this.set({ excluirEq:null });
this.showToast("✅ Equipamento excluído com sucesso.");
},

modalExcluirEq() {
const eq = this.state.excluirEq;
const bloqueado = this.temFilhos(eq) || this.temOSVinculada(eq);
return `
<div class="modal-overlay" data-close="excluirEq">
<div class="modal">
<div style="padding:24px 22px 0">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="font-size:26px">🗑️</span><div style="font-weight:700;font-size:15px;color:#991b1b">Excluir Equipamento</div></div>
<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;margin-bottom:14px">
<div style="display:flex;gap:8px;margin-bottom:4px"><span style="font-size:10px;color:#64748b;font-weight:600;min-width:60px">TAG:</span><span style="font-size:11px;font-family:monospace;color:#2563eb;font-weight:700">${esc(eq.tag)}</span></div>
<div style="display:flex;gap:8px"><span style="font-size:10px;color:#64748b;font-weight:600;min-width:60px">Descrição:</span><span style="font-size:11px;font-weight:600">${esc(eq.desc)}</span></div>
</div>
<div style="font-size:12px;color:#374151;margin-bottom:18px;line-height:1.5">Tem certeza que deseja excluir este equipamento? <b>Esta ação não poderá ser desfeita.</b></div>
${bloqueado ? `<div style="background:#fffbeb;border:1px solid #fde047;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#854d0e">${this.temFilhos(eq)?"⚠️ Este equipamento possui itens subordinados.":"⚠️ Este equipamento possui OS associadas e não pode ser excluído."}</div>`:""}
</div>
<div class="modal-rodape">
<button data-act="fecharModalExcluir" style="padding:10px 18px;background:#f1f5f9;border:none;border-radius:8px;cursor:pointer;font-size:12px;color:#374151">Cancelar</button>
<button data-act="confirmarExclusao" ${bloqueado?'disabled':''} style="flex:1;padding:10px;background:${bloqueado?'#fca5a5':'#dc2626'};color:#fff;border:none;border-radius:8px;cursor:${bloqueado?'not-allowed':'pointer'};font-weight:700;font-size:13px">🗑️ Confirmar Exclusão</button>
</div>
</div>
</div>
`;
},
fecharModalExcluir() { this.set({excluirEq:null}); },


iniciarFluxo(tipo) {
const s = this.state;
let lista = [];
if (tipo==="urgentes") lista = s.equipamentos.filter(e=>e.diasRestantes<=30).sort((a,b)=>a.diasRestantes-b.diasRestantes);
else if (tipo==="atencao") lista = s.equipamentos.filter(e=>e.diasRestantes>30 && e.diasRestantes<=60).sort((a,b)=>a.diasRestantes-b.diasRestantes);
else if (tipo==="abertas") lista = s.os.filter(o=>o.status!=="Concluida" && o.status!=="Cancelada").map(o=>s.equipamentos.find(e=>e.tag===o.tag)).filter(Boolean);
if (!lista.length && tipo!=="manual") { alert("Nenhum equipamento nesta categoria."); return; }
const periodoInicial = HOJE.toISOString().slice(0,10);
const maiorData = lista.length ? lista.reduce((max,e)=>e.dataIntervencao>max?e.dataIntervencao:max, lista[0].dataIntervencao) : HOJE;
const periodoFinal = maiorData.toISOString().slice(0,10);
this.set({
aprovFlow: {
tipo, lista, step:"config",
form:{ responsavel: s.usuarioLogado.nome, periodoInicial: tipo==="manual"?"":periodoInicial, periodoFinal: tipo==="manual"?"":periodoFinal },
listaDinamica: tipo==="manual" ? [] : undefined,
selecionados: tipo==="manual" ? [] : undefined,
carregando: false,
},
erroAprov: "", pcmAba:"os"
});
},

agendarAtualizacaoListaManual() {
const s = this.state;
if (!s.aprovFlow || s.aprovFlow.tipo !== "manual") return;
s.aprovFlow.carregando = true;
this.render();
clearTimeout(this._debounceManualTimer);
this._debounceManualTimer = setTimeout(() => this.atualizarListaManual(), 300);
},

atualizarListaManual() {
const s = this.state;
if (!s.aprovFlow || s.aprovFlow.tipo !== "manual") return;
const { periodoInicial, periodoFinal } = s.aprovFlow.form;
const ini = periodoInicial ? parseDataLocal(periodoInicial) : null;
const fim = periodoFinal ? parseDataLocal(periodoFinal) : null;

let novaLista = [];
if (ini || fim) {
novaLista = s.equipamentos.filter(e => {
if (e.ativo === false) return false;
if (ini && e.dataIntervencao < ini) return false;
if (fim && e.dataIntervencao > fim) return false;
return true;
}).sort((a,b)=>a.diasRestantes-b.diasRestantes);
}

const tagsAnteriores = new Set((s.aprovFlow.listaDinamica||[]).map(e=>e.tag));
const tagsNovas = new Set(novaLista.map(e=>e.tag));
const selecionadosAntes = s.aprovFlow.selecionados || [];

const mantidos = selecionadosAntes.filter(tag => tagsNovas.has(tag));
const removidos = selecionadosAntes.filter(tag => !tagsNovas.has(tag));
const novosElegiveis = novaLista.filter(e => !tagsAnteriores.has(e.tag)).map(e=>e.tag);

s.aprovFlow.listaDinamica = novaLista;
s.aprovFlow.selecionados = Array.from(new Set([...mantidos, ...novosElegiveis]));
s.aprovFlow.carregando = false;
this.render();

if (removidos.length > 0) {
const nomes = removidos.map(tag => (s.equipamentos.find(e=>e.tag===tag)||{}).desc || tag);
const texto = nomes.length > 2 ? `${nomes.slice(0,2).join(", ")} e mais ${nomes.length-2}` : nomes.join(", ");
this.showToast(`ℹ️ ${removidos.length} equipamento(s) removido(s) da seleção (fora do novo período): ${texto}`);
}
},

toggleSelecaoManual(tag) {
const s = this.state;
const sel = s.aprovFlow.selecionados || [];
const i = sel.indexOf(tag);
if (i >= 0) sel.splice(i,1); else sel.push(tag);
this.render();
},

selecionarTodosManual() {
const s = this.state;
s.aprovFlow.selecionados = (s.aprovFlow.listaDinamica||[]).map(e=>e.tag);
this.render();
},

limparSelecaoManual() {
this.state.aprovFlow.selecionados = [];
this.render();
},

cancelarAprov() { this.set({aprovFlow:null, erroAprov:""}); },
voltarConfig() { this.state.aprovFlow.step = "config"; this.render(); },

avancarPreview() {
const s = this.state;
const { responsavel } = s.aprovFlow.form;
if (!responsavel) { this.set({erroAprov:"Selecione um responsável."}); return; }
if (s.aprovFlow.tipo === "manual") {
const { periodoInicial, periodoFinal } = s.aprovFlow.form;
if (!periodoInicial || !periodoFinal) { this.set({erroAprov:"Informe o período inicial e final."}); return; }
const ini = parseDataLocal(periodoInicial), fim = parseDataLocal(periodoFinal);
if (isNaN(ini)||isNaN(fim)) { this.set({erroAprov:"Datas inválidas."}); return; }
if (fim<ini) { this.set({erroAprov:"Período final deve ser posterior ao inicial."}); return; }
const elegiveis = s.aprovFlow.listaDinamica || [];
if (elegiveis.length===0) { this.set({erroAprov:"Nenhum equipamento com intervenção prevista neste período."}); return; }
const selecionados = s.aprovFlow.selecionados || [];
const lista = elegiveis.filter(e=>selecionados.includes(e.tag));
if (lista.length===0) { this.set({erroAprov:"Selecione ao menos um equipamento da lista para gerar a OS."}); return; }
s.aprovFlow.lista = lista;
this.set({ erroAprov:"", aprovFlow: {...s.aprovFlow, step:"preview"} });
return;
}
if (!s.aprovFlow.lista || s.aprovFlow.lista.length===0) { this.set({erroAprov:"Nenhum equipamento selecionado."}); return; }
this.set({ erroAprov:"", aprovFlow: {...s.aprovFlow, step:"preview"} });
},

aprovarOS() {
const s = this.state;
const novas = s.aprovFlow.lista.map(eq=>{
const id = `OS-${String(this.osCnt).padStart(3,"0")}`; this.osCnt++;
return { id, tag:eq.tag, desc:eq.desc, criClasse:eq.criClasse, estrategias:eq.estrategias,
responsavel:s.aprovFlow.form.responsavel, periodoInicial:s.aprovFlow.form.periodoInicial, periodoFinal:s.aprovFlow.form.periodoFinal,
dataIntervencao:eq.dataIntervencao, prazoD:eq.prazoD, status:"Aberta", historico:[] };
});
s.os = [...novas, ...s.os];
this.set({ relatorio: { lista:s.aprovFlow.lista, form:s.aprovFlow.form, dataAprov: fmtDate(HOJE) }, aprovFlow:null });
this.showToast("✅ OS aprovadas e registradas com sucesso!");
},

salvarDetalheOS() {
const s = this.state;
const o = s.detalheOS;
const f = s.detalheForm;
if (f.status==="Em Andamento" && !f.dataPrevConc) { alert("Informe a data prevista de conclusão."); return; }
const agora = new Date();
const fmtDT = d=>d.toLocaleString("pt-BR");
const entrada = { dataHora:fmtDT(agora), status:f.status, responsavel:o.responsavel, dataPrevConc:f.status==="Em Andamento"?f.dataPrevConc:"", dataConclusao:f.status==="Concluida"?fmtDT(agora):"" };
if (f.status==="Concluida") {
s.equipamentos = s.equipamentos.map(eq=>{
if (eq.tag!==o.tag) return eq;
const novaRef = agora, novaData = addDias(novaRef, eq.prazoD);
return {...eq, ultimaManutencao:agora.toISOString().slice(0,10), naoSeiData:false, dataRef:novaRef, dataIntervencao:novaData, diasRestantes:diffDias(novaData)};
});
}
s.os = s.os.map(x=> x.id===o.id ? {...o, status:f.status, dataPrevConc:f.status==="Em Andamento"?f.dataPrevConc:o.dataPrevConc, dataConclusao:f.status==="Concluida"?fmtDT(agora):o.dataConclusao, historico:[...(o.historico||[]),entrada]} : x);
this.set({ detalheOS:null });
this.showToast("✅ Alteração salva com sucesso!");
},

salvarSolicitacaoCorretiva() {
const s = this.state;
const f = s.scForm;
const erros = {};

if (!f.setor) erros.setor = "Selecione o departamento/setor.";
if (!f.maquina) erros.maquina = "Selecione a máquina.";
if (!f.codigoPeca) erros.codigoPeca = "Selecione o código da peça.";
if (!f.dataOcorrencia) {
erros.dataOcorrencia = "Informe a data da ocorrência.";
} else if (isNaN(parseDataLocal(f.dataOcorrencia).getTime())) {
erros.dataOcorrencia = "Data inválida.";
}
if (!f.ocorrencia.trim()) erros.ocorrencia = "Descreva a ocorrência.";
else if (f.ocorrencia.length > 200) erros.ocorrencia = "Máximo de 200 caracteres.";
if (!f.impacto.trim()) erros.impacto = "Descreva o impacto da ocorrência.";
else if (f.impacto.length > 500) erros.impacto = "Máximo de 500 caracteres.";
if (!f.prioridade) erros.prioridade = "Selecione a prioridade da manutenção.";

if (Object.keys(erros).length > 0) { this.set({ scErros: erros }); return; }

const agora = new Date();
const dataHoraBrasilia = agora.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });

const registro = {
id: `SC-${String(this.scCnt).padStart(3,"0")}`,
setor: f.setor, maquina: f.maquina, codigoPeca: f.codigoPeca.trim(),
dataOcorrencia: f.dataOcorrencia, ocorrencia: f.ocorrencia.trim(), impacto: f.impacto.trim(),
prioridade: f.prioridade, dataHoraSolicitacao: dataHoraBrasilia,
solicitante: s.usuarioLogado.nome, status: "Pendente",
};
this.scCnt++;
s.solicitacoesCorretivas = [registro, ...s.solicitacoesCorretivas];

this.set({
scForm: { setor:"", maquina:"", codigoPeca:"", dataOcorrencia:"", ocorrencia:"", impacto:"", prioridade:"" },
scErros: {}
});
this.showToast("✅ Solicitação de manutenção corretiva registrada com sucesso!");
},
};


const root = document.getElementById("root");

root.addEventListener("click", function(ev){
const overlay = ev.target.closest(".modal-overlay");
if (overlay && ev.target === overlay) {
const key = overlay.getAttribute("data-close");
if (key) { App.state[key] = null; App.render(); }
return;
}
const el = ev.target.closest("[data-act]");
if (!el) return;
ev.preventDefault();
const act = el.getAttribute("data-act");
const p1 = el.getAttribute("data-p1");
const p2 = el.getAttribute("data-p2");
if (typeof App[act] === "function") App[act](p1, p2);
});

const BINDS_PERIODO_OS_MANUAL = ["aprovFlow.form.periodoInicial","aprovFlow.form.periodoFinal"];

root.addEventListener("input", function(ev){
const el = ev.target;
if (el.hasAttribute("data-bind")) {
const bind = el.getAttribute("data-bind");
setPath(App.state, bind, el.value);
if (BINDS_PERIODO_OS_MANUAL.includes(bind)) { App.agendarAtualizacaoListaManual(); return; }
if (el.hasAttribute("data-rerender")) App.render();
}
});

root.addEventListener("change", function(ev){
const el = ev.target;
if (el.tagName === "SELECT" || el.type === "date" || el.type === "radio") {
if (el.hasAttribute("data-bind")) {
const bind = el.getAttribute("data-bind");
const val = el.type === "radio" ? el.value : el.value;
setPath(App.state, bind, val);
if (BINDS_PERIODO_OS_MANUAL.includes(bind)) { App.agendarAtualizacaoListaManual(); return; }
if (el.hasAttribute("data-rerender")) App.render();
}
}
});

App.render();
</script>

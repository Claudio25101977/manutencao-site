<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema PCM — Login</title>
<style>
:root{
--vermelho:#CC1B1B; --vermelho-escuro:#A81616; --vermelho-suave:rgba(204,27,27,.10);
--fundo:#F7F8FC; --branco:#FFFFFF; --texto:#1A202C; --texto-sec:#718096; --borda:#E7EAF3;
--radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:inherit}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--vermelho);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(204,27,27,.3)}
.login-titulo{text-align:center;margin-bottom:28px}
.login-titulo h1{font-size:1.5rem;font-weight:700}
.login-titulo p{font-size:.9rem;color:var(--texto-sec);margin-top:4px}
.login-card{background:var(--branco);width:100%;max-width:400px;border-radius:var(--radius);box-shadow:0 8px 24px rgba(26,32,44,.08);padding:34px 32px 28px;border:1px solid rgba(26,32,44,.04)}
.login-card h2{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.login-card .sub{font-size:.83rem;color:var(--texto-sec);margin-bottom:20px}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;padding:11px 13px;font-size:.9rem;border:1.5px solid var(--borda);border-radius:8px;background:var(--branco)}
.input-wrap input:focus{outline:none;border-color:var(--vermelho);box-shadow:0 0 0 3px var(--vermelho-suave)}
.erro-txt{color:#dc2626;font-size:.76rem;margin-top:5px;display:block}
.toggle-senha{position:absolute;right:8px;background:none;border:none;color:var(--texto-sec);padding:6px;border-radius:6px}
.toggle-senha:hover{color:var(--vermelho);background:var(--vermelho-suave)}
.segment{display:flex;background:var(--fundo);border-radius:9px;padding:3px;margin-bottom:16px;border:1px solid var(--borda)}
.segment button{flex:1;padding:9px;border:none;background:none;border-radius:7px;font-size:.8rem;font-weight:600;color:var(--texto-sec)}
.segment button.ativo{background:var(--vermelho);color:#fff;box-shadow:0 2px 6px rgba(204,27,27,.3)}
.btn{width:100%;padding:12px 20px;border-radius:8px;font-size:.9rem;font-weight:600;border:none;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primario{background:var(--vermelho);color:#fff;box-shadow:0 4px 12px rgba(204,27,27,.25)}
.btn-primario:hover{background:var(--vermelho-escuro)}
.btn-secundario{background:var(--branco);border:1.5px solid var(--borda);color:var(--texto)}
.btn-secundario:hover{background:var(--fundo)}
.btn-primario:disabled{opacity:.7;cursor:not-allowed}
.spinner{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:girar .7s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.login-footer{margin-top:26px;text-align:center;font-size:.76rem;color:var(--texto-sec)}
.lembrar-linha{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:.83rem}
.lembrar-linha label{display:flex;align-items:center;gap:8px;color:var(--texto-sec);cursor:pointer}
.demo-hint{background:var(--fundo);border:1px dashed var(--borda);border-radius:8px;padding:10px 12px;font-size:.74rem;color:var(--texto-sec);margin-bottom:16px;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>

<script>
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const App = {
state: {
tipoAcesso: "colaborador",
usuario: "", senha: "", mostrarSenha:false, lembrar:false, erros:{}, carregando:false,
},

set(patch) { Object.assign(this.state, patch); this.render(); },

render() {
const s = this.state;
const e = s.erros;
document.getElementById("root").innerHTML = `
<div class="login-wrap">
<div class="login-titulo">
<div class="login-logo">
<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
</svg>
</div>
<h1>Sistema PCM</h1>
<p>Gráfica Cometa — Planejamento e Controle da Manutenção</p>
</div>

<form class="login-card" id="login-form" novalidate>
<h2>Acesso ao Sistema</h2>
<p class="sub">Informe suas credenciais para continuar</p>

<div class="segment">
<button type="button" data-act="setTipo" data-p1="colaborador" class="${s.tipoAcesso==='colaborador'?'ativo':''}">Colaborador (PCM)</button>
<button type="button" data-act="setTipo" data-p1="admin" class="${s.tipoAcesso==='admin'?'ativo':''}">Administrador</button>
</div>

<div class="campo">
<label for="in-usuario">Usuário</label>
<div class="input-wrap">
<input id="in-usuario" type="text" autocomplete="username" placeholder="Informe seu usuário"
value="${esc(s.usuario)}" data-bind="usuario"
style="${e.usuario?'border-color:#dc2626':''}">
</div>
${e.usuario?`<span class="erro-txt">${esc(e.usuario)}</span>`:""}
</div>

<div class="campo">
<label for="in-senha">Senha</label>
<div class="input-wrap">
<input id="in-senha" type="${s.mostrarSenha?'text':'password'}" autocomplete="current-password" placeholder="Informe sua senha"
value="${esc(s.senha)}" data-bind="senha"
style="padding-right:40px;${e.senha?'border-color:#dc2626':''}">
<button type="button" class="toggle-senha" data-act="toggleSenha" aria-label="Mostrar/ocultar senha">
${s.mostrarSenha
? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'}
</button>
</div>
${e.senha?`<span class="erro-txt">${esc(e.senha)}</span>`:""}
</div>

<div class="lembrar-linha">
<label><input type="checkbox" data-bind-bool="lembrar" ${s.lembrar?'checked':''}> Lembrar usuário</label>
<a href="#" data-act="esqueciSenha" style="color:var(--vermelho);font-weight:600;text-decoration:none;">Esqueci minha senha</a>
</div>

<button type="submit" class="btn btn-primario" ${s.carregando?'disabled':''} style="margin-bottom:10px">
${s.carregando?'<span class="spinner"></span> Autenticando...':'Entrar'}
</button>
<button type="button" class="btn btn-secundario" data-act="limparLogin">Limpar</button>
</form>

<div class="login-footer">© 2026 Sistema PCM — Gráfica Cometa · Versão 1.0</div>
</div>
`;
},

setTipo(v) { this.set({tipoAcesso: v}); },
toggleSenha() { this.set({mostrarSenha: !this.state.mostrarSenha}); },
limparLogin() { this.set({usuario:"", senha:"", erros:{}}); },
esqueciSenha() { alert('Funcionalidade "Esqueci minha senha" ainda não implementada.'); },

entrar() {
const s = this.state;
const erros = {};
if (!s.usuario.trim()) erros.usuario = "Informe o usuário.";
if (!s.senha.trim()) erros.senha = "Informe a senha.";
if (Object.keys(erros).length > 0) { this.set({erros}); return; }
this.set({erros:{}, carregando:true});
setTimeout(() => {
const perfil = s.tipoAcesso === "admin" ? "Administrador" : "Operador";
const nome = s.tipoAcesso === "admin" ? "Ana Silva" : (s.usuario.trim() || "Mauro Ledur");
const params = "?nome=" + encodeURIComponent(nome) + "&perfil=" + encodeURIComponent(perfil);
window.location.href = (perfil === "Administrador" ? "admin.html" : "pcm.html") + params;
}, 700);
},
};

const root = document.getElementById("root");

root.addEventListener("click", function(ev){
const el = ev.target.closest("[data-act]");
if (!el) return;
ev.preventDefault();
const act = el.getAttribute("data-act");
const p1 = el.getAttribute("data-p1");
if (typeof App[act] === "function") App[act](p1);
});

root.addEventListener("submit", function(ev){
if (ev.target && ev.target.id === "login-form") {
ev.preventDefault();
App.entrar();
}
});

root.addEventListener("input", function(ev){
const el = ev.target;
if (el.hasAttribute("data-bind")) {
App.state[el.getAttribute("data-bind")] = el.value;
} else if (el.hasAttribute("data-bind-bool")) {
App.state[el.getAttribute("data-bind-bool")] = el.checked;
}
});

App.render();
</script>
</body>
</html>

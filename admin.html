<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Admin — Sistema PCM</title>
<style>
:root{
  --ink:#14181C; --ink-2:#1D2227; --paper:#F6F3EC; --paper-2:#EFEAE0; --white:#FFFFFF;
  --gold:#AD8752; --gold-soft:#D9C6A3; --teal:#2C5457; --teal-soft:#4B7C7E;
  --line:#DCD4C2; --line-dark:#33393F;
  --vermelho:var(--gold); --vermelho-escuro:var(--teal); --vermelho-suave:rgba(173,135,82,.10); --vermelho-suave-2:rgba(173,135,82,.18);
  --fundo:var(--paper); --branco:var(--white); --texto:var(--ink); --texto-sec:rgba(20,24,28,.60); --borda:var(--line);
  --sombra-sm:0 1px 3px rgba(26,32,44,.06); --sombra-md:0 8px 24px rgba(26,32,44,.08);
  --radius:12px; --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:inherit;text-decoration:none}

.header{position:fixed;top:0;left:0;right:0;height:64px;background:var(--branco);border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;box-shadow:var(--sombra-sm)}
.header-esq{display:flex;align-items:center;gap:12px}
.logo-mini{width:38px;height:38px;border-radius:10px;background:var(--vermelho);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca-texto h1{font-size:.92rem;font-weight:700;line-height:1.2}
.marca-texto p{font-size:.7rem;color:var(--texto-sec)}
.header-dir{display:flex;align-items:center;gap:8px}
.usuario-area{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--borda)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--vermelho),var(--vermelho-escuro));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.75rem;flex-shrink:0}
.usuario-info .nome{font-size:.8rem;font-weight:600;line-height:1.2}
.usuario-info .funcao{font-size:.68rem;color:var(--texto-sec)}
.btn-sair{padding:8px 14px;font-size:.78rem;font-weight:600;color:var(--vermelho);background:var(--vermelho-suave);border:none;border-radius:8px;display:inline-block}
.btn-sair:hover{background:var(--vermelho-suave-2)}
.btn-trocar{padding:8px 14px;font-size:.78rem;font-weight:600;color:var(--texto);background:var(--fundo);border:1px solid var(--borda);border-radius:8px;display:inline-block}
.btn-trocar:hover{background:var(--vermelho-suave);border-color:transparent;color:var(--vermelho)}

.sidebar{position:fixed;top:64px;left:0;bottom:0;width:238px;background:var(--branco);border-right:1px solid var(--borda);padding:16px 12px;overflow-y:auto;z-index:90}
.menu-secao{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-sec);padding:14px 12px 6px}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:.85rem;font-weight:500;color:var(--texto);cursor:pointer;margin-bottom:2px;position:relative;border:none;background:none;width:100%;text-align:left}
.menu-item:hover{background:var(--fundo)}
.menu-item.ativo{background:var(--vermelho-suave);color:var(--vermelho);font-weight:600}
.menu-item.ativo::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--vermelho);border-radius:0 3px 3px 0}

.conteudo{margin-left:238px;margin-top:64px;padding:26px 30px 60px;min-height:calc(100vh - 64px)}
.cabecalho-pagina{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:22px}
.cabecalho-pagina h2{font-size:1.35rem;font-weight:700}
.breadcrumb{font-size:.8rem;color:var(--texto-sec);margin-top:4px}
.breadcrumb .ativo{color:var(--vermelho);font-weight:600}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card-kpi{background:var(--branco);border-radius:var(--radius);padding:14px;box-shadow:var(--sombra-sm);border:1px solid var(--borda)}
.card-kpi-valor{font-size:1.5rem;font-weight:800}
.card-kpi-label{font-size:.72rem;color:var(--texto-sec);margin-top:2px;font-weight:600}

.painel{background:var(--branco);border-radius:var(--radius);border:1px solid var(--borda);box-shadow:var(--sombra-sm);margin-bottom:22px;overflow:hidden}
.painel-cab{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--borda);flex-wrap:wrap;gap:12px}
.painel-cab h3{font-size:.98rem;font-weight:700}
.painel-cab .subt{font-size:.76rem;color:var(--texto-sec);margin-top:2px}
.busca-wrap{position:relative;max-width:240px;flex:1;min-width:170px}
.busca-wrap input{width:100%;padding:8px 12px 8px 30px;border:1.5px solid var(--borda);border-radius:8px;font-size:.83rem;background:var(--fundo)}
.busca-wrap input:focus{outline:none;border-color:var(--vermelho);background:#fff;box-shadow:0 0 0 3px var(--vermelho-suave)}
.busca-wrap .icone{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--texto-sec);font-size:.8rem}

table.tab-adm{width:100%;border-collapse:collapse;font-size:.82rem}
table.tab-adm thead th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-sec);font-weight:700;padding:11px 16px;background:var(--fundo);border-bottom:1px solid var(--borda);white-space:nowrap}
table.tab-adm tbody td{padding:11px 16px;border-bottom:1px solid var(--borda)}
table.tab-adm tbody tr:hover{background:#FBFBFE}
table.tab-adm tbody tr:last-child td{border-bottom:none}
.usr-tab{display:flex;align-items:center;gap:9px}
.usr-tab .avatar{width:30px;height:30px;font-size:.68rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700;padding:3px 10px;border-radius:999px}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-ativo{color:#16a34a;background:#ecfdf3}
.badge-inativo{color:var(--texto-sec);background:#EDF0F5}
.badge-pendente{color:#b45309;background:#fffbeb}
.badge-nivel{font-size:.66rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--vermelho-suave);color:var(--vermelho)}
.acao-icone{background:none;border:none;color:var(--texto-sec);padding:6px;border-radius:8px}
.acao-icone:hover{background:var(--vermelho-suave);color:var(--vermelho)}

.placeholder-box{background:var(--branco);border:1px dashed var(--borda);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--texto-sec);font-size:.85rem}
.placeholder-box .emoji{font-size:1.8rem;margin-bottom:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,32,44,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--branco);border-radius:var(--radius);width:100%;max-width:460px;box-shadow:var(--sombra-md);max-height:90vh;overflow-y:auto}
.modal-cab{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--borda)}
.modal-cab h3{font-size:1rem;font-weight:700}
.modal-cab button{background:none;border:none;font-size:1rem}
.modal-corpo{padding:20px 22px}
.modal-rodape{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--borda);flex-wrap:wrap}
.modal-erro{margin:0 22px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;color:#dc2626;font-size:.8rem}
.log-item{padding:11px 14px;border-radius:8px;background:var(--fundo);margin-bottom:8px;font-size:.8rem;border-left:3px solid var(--vermelho)}
.campo-lbl{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.campo-inp{width:100%;padding:11px 13px;font-size:.9rem;border:1.5px solid var(--borda);border-radius:8px}

.aviso-mock{background:#fffbeb;border:1px solid #fde047;border-radius:10px;padding:12px 16px;font-size:.78rem;color:#854d0e;margin-bottom:20px;line-height:1.5}
.secao-indicador{margin-bottom:8px;margin-top:26px}
.secao-indicador:first-child{margin-top:0}
.secao-indicador h3{font-size:1.02rem;font-weight:700;margin-bottom:2px}
.card-ind{background:var(--branco);border:1px solid var(--borda);border-radius:var(--radius);box-shadow:var(--sombra-sm);padding:18px 20px;margin-bottom:14px}
.card-ind-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.card-ind-titulo{font-size:.95rem;font-weight:700}
.card-ind-valor{font-size:1.6rem;font-weight:800;white-space:nowrap}
.card-ind-status{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:4px}
.st-ok{color:#16a34a;background:#ecfdf3}
.st-alerta{color:#b45309;background:#fffbeb}
.st-critico{color:#dc2626;background:#fef2f2}
.st-info{color:#2563eb;background:#eff6ff}
.card-ind-formula{background:var(--fundo);border-radius:8px;padding:9px 12px;font-family:monospace;font-size:.78rem;color:var(--texto);margin-bottom:10px;border-left:3px solid var(--vermelho)}
.card-ind-texto{font-size:.82rem;color:var(--texto);line-height:1.55;margin-bottom:8px}
.card-ind-obs{font-size:.76rem;color:var(--texto-sec);background:var(--fundo);border-radius:8px;padding:8px 12px;line-height:1.5;margin-bottom:8px}
.card-ind-meta{font-size:.76rem;color:var(--texto-sec)}
.mini-tab{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:10px}
.mini-tab th{text-align:left;padding:6px 10px;background:var(--fundo);font-size:.65rem;text-transform:uppercase;color:var(--texto-sec);font-weight:700}
.mini-tab td{padding:6px 10px;border-bottom:1px solid var(--borda)}

@media (max-width:900px){
.sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--sombra-md)}
.sidebar.aberta{transform:translateX(0)}
.conteudo{margin-left:0}
.usuario-info{display:none}
.btn-menu-mobile{display:flex !important}
}
.btn-menu-mobile{display:none;background:none;border:none;color:var(--texto);padding:8px;border-radius:8px;margin-right:4px}
.btn-menu-mobile:hover{background:var(--fundo)}
.overlay-sidebar{display:none;position:fixed;inset:0;background:rgba(26,32,44,.4);z-index:80}
.overlay-sidebar.ativo{display:block}
</style>
</head>
<body>
<div id="root"></div>

<script>
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function setPath(obj, path, val){ const parts = path.split("."); let o = obj; for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = val; }

function lerParamsUsuario() {
const params = new URLSearchParams(window.location.search);
return { nome: params.get("nome") || "Cláudio", perfil: params.get("perfil") || "Administrador" };
}

const MOCK_MTBF = [];
const MOCK_REPAROS = [];
const MOCK_ORDENS = [];

function calcularIndicadores() {
const mtbfLista = MOCK_MTBF.map(e => ({ ...e, mtbf: e.falhas===0 ? e.diasOperacao : +(e.diasOperacao / e.falhas).toFixed(1) }));
const totalHorasReparo = MOCK_REPAROS.reduce((a,r)=>a+r.horas,0);
const mttr = +(totalHorasReparo / MOCK_REPAROS.length).toFixed(1);
const concluidas = MOCK_ORDENS.filter(o=>o.status==="Concluida");
const totalOS = MOCK_ORDENS.length;
const preventivasTotal = MOCK_ORDENS.filter(o=>o.tipo==="Preventiva").length;
const corretivasTotal = MOCK_ORDENS.filter(o=>o.tipo==="Corretiva").length;
const pctPreventiva = +(preventivasTotal/totalOS*100).toFixed(1);
const pctCorretiva = +(corretivasTotal/totalOS*100).toFixed(1);
const preventivasConcluidas = concluidas.filter(o=>o.tipo==="Preventiva");
const preventivasNoPrazo = preventivasConcluidas.filter(o=>o.dentroPrazo===true).length;
const cumprimentoPlano = preventivasConcluidas.length>0 ? +(preventivasNoPrazo/preventivasConcluidas.length*100).toFixed(1) : 0;
const abertas = MOCK_ORDENS.filter(o=>o.status==="Aberta" || o.status==="Em Andamento");
const backlogSemanas = abertas.reduce((a,o)=>a+(o.semanasPendente||0),0);
const totalFalhas = MOCK_MTBF.reduce((a,e)=>a+e.falhas,0);
const equipReincidentes = MOCK_MTBF.filter(e=>e.falhas>=2).length;
const indiceReincidencia = +(equipReincidentes/MOCK_MTBF.length*100).toFixed(1);
return { mtbfLista, mttr, pctPreventiva, pctCorretiva, cumprimentoPlano, backlogSemanas, abertasCount: abertas.length, totalFalhas, equipReincidentes, totalEquip: MOCK_MTBF.length, indiceReincidencia };
}


const LS_USUARIOS = "pcmAdmin_usuarios"; const LS_SETORES = "pcmAdmin_setores"; const LS_LOGS = "pcmAdmin_logAuditoria"; const App = {
state: {
usuarioLogado: lerParamsUsuario(),
adminSecao: "dashboard",

usuarios: [],
adminBusca:"",
adminModalAberto:false,
usuarioEditandoEmail: null,
usuarioModalErro:"",
novoUsuario: {nome:"", email:"", nivel:"Operador", depto:"", status:"ativo", permissoes:{cadastroEquipamento:false, emissaoOS:false, solicitacaoCorretiva:false, aprovacaoOS:false}},

setores: [],

confirmDialog: null,
sidebarAberta: false,

logAuditoria: [],
},

set(patch) { Object.assign(this.state, patch); this.persistir(); this.render(); }, persistir() { try { localStorage.setItem(LS_USUARIOS, JSON.stringify(this.state.usuarios)); localStorage.setItem(LS_SETORES, JSON.stringify(this.state.setores)); localStorage.setItem(LS_LOGS, JSON.stringify(this.state.logAuditoria)); } catch (e) { console.error("Erro ao persistir dados no localStorage:", e); } },

render() {
const s = this.state;
const ITENS = [
{id:"dashboard", label:"Dashboard"},
{id:"usuarios", label:"Usuários"},
{id:"logs", label:"Logs de Auditoria"},
{id:"indicadores", label:"Indicadores Gerenciais"},
];

const corpo = this.renderCorpo(s);

const iniciais = s.usuarioLogado.nome.split(" ").map(n=>n[0]).slice(0,2).join("");
const paramsAtual = "?nome=" + encodeURIComponent(s.usuarioLogado.nome) + "&perfil=" + encodeURIComponent(s.usuarioLogado.perfil);

const html = `
<header class="header">
<div class="header-esq">
<button class="btn-menu-mobile" data-act="toggleSidebar" aria-label="Abrir menu">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="logo-mini">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
</svg>
</div>
<div class="marca-texto"><h1>Portal Admin</h1><p>Sistema PCM</p></div>
</div>
<div class="header-dir">
<a class="btn-trocar" href="${'pcm.html' + paramsAtual}">Acessar Sistema PCM</a>
<div class="usuario-area">
<div class="avatar">${esc(iniciais)}</div>
<div class="usuario-info"><div class="nome">${esc(s.usuarioLogado.nome)}</div><div class="funcao">${esc(s.usuarioLogado.perfil)}</div></div>
</div>
<a class="btn-sair" href="login.html">Sair</a>
</div>
</header>
<div class="overlay-sidebar ${s.sidebarAberta?'ativo':''}" data-act="fecharSidebar"></div>
<nav class="sidebar ${s.sidebarAberta?'aberta':''}">
<div class="menu-secao">Administração</div>
${ITENS.map(i=>`<button class="menu-item ${s.adminSecao===i.id?'ativo':''}" data-act="selecionarSecao" data-p1="${i.id}">${esc(i.label)}</button>`).join("")}
</nav>
<main class="conteudo">${corpo}</main>
${s.adminModalAberto ? this.modalUsuario() : ""}
${s.confirmDialog ? this.modalConfirmacao() : ""}
`;

document.getElementById("root").innerHTML = html;
},

renderCorpo(s) {
if (s.adminSecao === "dashboard") return this.paginaDashboard(s);
if (s.adminSecao === "usuarios") return this.paginaUsuarios(s);
if (s.adminSecao === "logs") return this.paginaLogs(s);
if (s.adminSecao === "indicadores") return this.paginaIndicadores();
return "";
},

setAdminSecao(id) { this.set({adminSecao:id}); },
selecionarSecao(id) { this.set({adminSecao:id, sidebarAberta:false}); },
toggleSidebar() { this.set({ sidebarAberta: !this.state.sidebarAberta }); },
fecharSidebar() { this.set({ sidebarAberta:false }); },


/* ============================= DASHBOARD ============================= */
paginaDashboard(s) {
return `
<div class="cabecalho-pagina"><div><h2>Visão Geral</h2><p class="breadcrumb">Portal Admin / <span class="ativo">Dashboard</span></p></div></div>
<div class="grid-kpi">
<div class="card-kpi"><div class="card-kpi-valor">${s.usuarios.length}</div><div class="card-kpi-label">Usuários cadastrados</div></div>
<div class="card-kpi"><div class="card-kpi-valor">${s.usuarios.filter(u=>u.status==='ativo').length}</div><div class="card-kpi-label">Usuários ativos</div></div>
<div class="card-kpi"><div class="card-kpi-valor">${s.setores.length}</div><div class="card-kpi-label">Setores cadastrados</div></div>
<div class="card-kpi"><div class="card-kpi-valor">${s.logAuditoria.length}</div><div class="card-kpi-label">Eventos de auditoria</div></div>
</div>
<div class="placeholder-box"><div class="emoji">⚙️</div>A operação do PCM (equipamentos, ordens de serviço, estratégias) roda em um sistema dedicado.<br>Use o botão <b>"Acessar Sistema PCM"</b> no topo da tela.</div>
`;
},

/* ============================= USUÁRIOS ============================= */
paginaUsuarios(s) {
const termo = s.adminBusca.toLowerCase();
const filtrados = s.usuarios.filter(u=>!termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo) || u.depto.toLowerCase().includes(termo));
return `
<div class="cabecalho-pagina">
<div><h2>Gestão de Usuários</h2><p class="breadcrumb">Portal Admin / <span class="ativo">Usuários</span></p></div>
<button style="width:auto;padding:10px 18px;background:var(--vermelho);color:#fff;font-weight:700;font-size:12px;border-radius:8px;border:none" data-act="abrirModalUsuario">+ Novo Usuário</button>
</div>
<div class="painel">
<div class="painel-cab">
<div><h3>Usuários do Sistema</h3><p class="subt">Gerencie contas e níveis de acesso</p></div>
<div class="busca-wrap"><span class="icone">🔍</span><input placeholder="Buscar usuário..." value="${esc(s.adminBusca)}" data-bind="adminBusca" data-rerender="1"></div>
</div>
<div style="overflow-x:auto">
<table class="tab-adm">
<thead><tr><th>Usuário</th><th>Nível</th><th>Setor</th><th>Status</th><th>Permissões</th><th>Ações</th></tr></thead>
<tbody>
${filtrados.length===0 ? `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--texto-sec)">Nenhum usuário encontrado.</td></tr>` : filtrados.map(u=>`
<tr>
<td><div class="usr-tab"><div class="avatar">${esc(u.iniciais)}</div><div><div style="font-weight:600">${esc(u.nome)}</div><div style="font-size:.72rem;color:var(--texto-sec)">${esc(u.email)}</div></div></div></td>
<td><span class="badge-nivel">${esc(u.nivel)}</span></td>
<td>${esc(u.depto)}</td>
<td><span class="badge ${u.status==='ativo'?'badge-ativo':u.status==='pendente'?'badge-pendente':'badge-inativo'}">${u.status==='ativo'?'Ativo':u.status==='pendente'?'Pendente':'Inativo'}</span></td>
<td><div style="display:flex;gap:4px;flex-wrap:wrap">
${u.permissoes?.cadastroEquipamento?'<span class="badge-nivel" title="Cadastro de equipamento">📦 Equip.</span>':''}
${u.permissoes?.emissaoOS?'<span class="badge-nivel" title="Emissão de Ordem de manutenção">📋 OS</span>':''}
${u.permissoes?.solicitacaoCorretiva?'<span class="badge-nivel" title="Solicitação de manutenção corretiva">🔧 Corretiva</span>':''}
${(!u.permissoes || (!u.permissoes.cadastroEquipamento && !u.permissoes.emissaoOS && !u.permissoes.solicitacaoCorretiva)) ? '<span style="font-size:.7rem;color:var(--texto-sec)">—</span>' : ''}
</div></td>
<td>
<button class="acao-icone" title="Editar" data-act="abrirEditarUsuario" data-p1="${esc(u.email)}">✏️</button>

abrirModalUsuario() {
this.set({
adminModalAberto:true, usuarioEditandoEmail:null, usuarioModalErro:"",
novoUsuario: {nome:"", email:"", nivel:"Operador", depto:"", status:"ativo", permissoes:{cadastroEquipamento:false, emissaoOS:false, solicitacaoCorretiva:false, aprovacaoOS:false}}
});
},

abrirEditarUsuario(email) {
const u = this.state.usuarios.find(x=>x.email===email);
if (!u) return;
this.set({
adminModalAberto:true, usuarioEditandoEmail:email, usuarioModalErro:"",
novoUsuario: { nome:u.nome, email:u.email, nivel:u.nivel, depto:u.depto, status:u.status,
permissoes: { cadastroEquipamento: !!u.permissoes?.cadastroEquipamento, emissaoOS: !!u.permissoes?.emissaoOS, solicitacaoCorretiva: !!u.permissoes?.solicitacaoCorretiva, aprovacaoOS: !!u.permissoes?.aprovacaoOS } }
});
},

fecharModalUsuario() { this.set({adminModalAberto:false, usuarioEditandoEmail:null, usuarioModalErro:""}); },

toggleNovaPermissao(chave) {
this.state.novoUsuario.permissoes[chave] = !this.state.novoUsuario.permissoes[chave];
this.render();
},

confirmarRemoverUsuario(email) {
const u = this.state.usuarios.find(x=>x.email===email);
if (!u) return;
this.set({ confirmDialog: {
mensagem: `Tem certeza que deseja remover o usuário "${u.nome}"? Esta ação não poderá ser desfeita.`,
acao: "removerUsuarioConfirmado", parametro: email
}});
},

removerUsuarioConfirmado(email) {
this.state.usuarios = this.state.usuarios.filter(x=>x.email!==email);
this.set({ confirmDialog:null });
},

salvarUsuarioAdmin() {
const s = this.state;
const n = s.novoUsuario;
if (!n.nome.trim() || !n.email.trim()) { this.set({usuarioModalErro:"Preencha ao menos o nome e o e-mail."}); return; }
const emailOriginal = s.usuarioEditandoEmail;
const emailDuplicado = s.usuarios.some(u => u.email.toLowerCase()===n.email.trim().toLowerCase() && u.email!==emailOriginal);
if (emailDuplicado) { this.set({usuarioModalErro:"Já existe um usuário com este e-mail."}); return; }

const iniciais = n.nome.trim().split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const registro = { iniciais, nome:n.nome.trim(), email:n.email.trim(), nivel:n.nivel, depto:n.depto||"—", status:n.status,
permissoes: { cadastroEquipamento:!!n.permissoes.cadastroEquipamento, emissaoOS:!!n.permissoes.emissaoOS, solicitacaoCorretiva:!!n.permissoes.solicitacaoCorretiva, aprovacaoOS:!!n.permissoes.aprovacaoOS } };
  
if (emailOriginal) s.usuarios = s.usuarios.map(u => u.email===emailOriginal ? registro : u);
else s.usuarios.push(registro);

this.set({adminModalAberto:false, usuarioEditandoEmail:null, usuarioModalErro:""});
},

const root = document.getElementById("root");

root.addEventListener("click", function(ev){
const overlay = ev.target.closest(".modal-overlay");
if (overlay && ev.target === overlay) {
const key = overlay.getAttribute("data-close");
if (key) {
App.state[key] = (key === "confirmDialog") ? null : false;
App.state.usuarioEditandoEmail = null;
App.state.setorEditandoNome = null;
App.render();
}
return;
}
const el = ev.target.closest("[data-act]");
if (!el) return;
ev.preventDefault();
const act = el.getAttribute("data-act");
const p1 = el.getAttribute("data-p1");
if (typeof App[act] === "function") App[act](p1);
});

root.addEventListener("input", function(ev){
const el = ev.target;
if (el.hasAttribute("data-bind")) {
setPath(App.state, el.getAttribute("data-bind"), el.value);
if (el.hasAttribute("data-rerender")) App.render();
}
});

root.addEventListener("change", function(ev){
const el = ev.target;
if (el.tagName === "SELECT" && el.hasAttribute("data-bind")) {
setPath(App.state, el.getAttribute("data-bind"), el.value);
App.render();
}
});

(function(){ try { const u = localStorage.getItem(LS_USUARIOS); if (u) { const p = JSON.parse(u); if (Array.isArray(p)) App.state.usuarios = p; } } catch(e) { console.error("Erro ao carregar usuarios do localStorage:", e); } try { const st = localStorage.getItem(LS_SETORES); if (st) { const p = JSON.parse(st); if (Array.isArray(p)) App.state.setores = p; } } catch(e) { console.error("Erro ao carregar setores do localStorage:", e); } try { const lg = localStorage.getItem(LS_LOGS); if (lg) { const p = JSON.parse(lg); if (Array.isArray(p)) App.state.logAuditoria = p; } } catch(e) { console.error("Erro ao carregar logAuditoria do localStorage:", e); } })(); App.render();</script>
